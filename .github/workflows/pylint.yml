name: Pylint

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  actions: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        uses: ./.github/actions/setup-python-deps

      - name: Run Pylint
        run: |
          pylint --fail-under=8.0 $(git ls-files '*.py')
